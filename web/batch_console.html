<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>批量研究控制台</title><style>
:root{font-family:"Segoe UI Variable","PingFang SC","Microsoft YaHei",sans-serif;color:#18252a;background:#eef1ee}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:44px 24px 72px}header{display:flex;justify-content:space-between;gap:24px;align-items:end;border-bottom:1px solid #cfd7d1;padding-bottom:24px}h1{font-size:30px;letter-spacing:-.04em;margin:0}header p{margin:8px 0 0;color:#617075;font-size:14px}.badge{font-size:12px;color:#287268;background:#d9efeb;padding:7px 10px;border-radius:999px}.panel{background:#fbfcfa;border:1px solid #d4dad5;border-radius:14px;padding:22px;margin-top:24px}.controls{display:flex;gap:14px;align-items:end;flex-wrap:wrap}.field{display:grid;gap:7px;font-size:12px;color:#526267}.range{display:flex;align-items:center;gap:7px}input{height:36px;width:76px;border:1px solid #b9c5bf;border-radius:7px;padding:0 10px;background:#fff;font:inherit}input.ports{width:170px}button{height:36px;border:1px solid #17242a;border-radius:7px;padding:0 16px;background:#17242a;color:#f8fbf9;font-weight:650;cursor:pointer}button.secondary{border-color:#aeb8b2;background:transparent;color:#435357}button:disabled{opacity:.5;cursor:not-allowed}.hint{font-size:12px;color:#68777a;margin:18px 0 0;line-height:1.6}.nodes{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.node{font-size:12px;padding:7px 9px;border:1px solid #d4dad5;border-radius:7px;background:#fff}.ok{border-color:#91b9ad;color:#286b5d}.bad{border-color:#d2a2a2;color:#9f4242}.list{margin-top:24px;display:grid;gap:10px}.item{background:#fbfcfa;border:1px solid #d4dad5;border-radius:10px;padding:14px 16px}.top{display:flex;gap:10px;align-items:center}.num{font-family:ui-monospace,Consolas;color:#287268;font-size:12px;min-width:28px}.question{font-weight:650;flex:1}.state{font-size:12px;color:#617075}.detail{margin:10px 0 0;padding-top:10px;border-top:1px solid #e0e5e1;color:#516166;font-size:12px;line-height:1.7}.feedback{margin-top:8px;padding:9px 11px;background:#f0f5f2;border-radius:7px;color:#425458}.error{color:#a53838;margin-top:12px;font-size:13px}a{color:#176f65;font-weight:650}@media(max-width:640px){.wrap{padding:28px 14px}header{align-items:start;flex-direction:column}.panel{padding:16px}.question{font-size:14px}}
</style></head><body><main class="wrap"><header><div><h1>批量研究控制台</h1><p>V1 → Critic 反馈 → V2 → Critic 反馈 → V3，完成后导出 PDF、MD 与压缩包。</p></div><span class="badge" id="summary">等待启动</span></header><section class="panel"><div class="controls"><label class="field">起始序号<div class="range"><input id="start" type="number" min="1" max="125" value="21">至<input id="end" type="number" min="1" max="125" value="35"></div></label><label class="field">Qwen 模型<input class="ports" id="model" placeholder="填写有额度的模型名"></label><label class="field">后端端口<input class="ports" id="ports" value="8901,8902,8903,8904,8905,8906,8907,8908,8909,8910"></label><label class="field">输出目录<input class="ports" id="outputDir" value="output/21-35"></label><button id="startButton">检查并开始</button><button class="secondary" id="switchButton">切换模型并继续</button><button class="secondary" id="resetButton">页面重置</button></div><p class="hint">输出目录内自动创建 <b>PDF/</b>、<b>MD/</b> 和同名 ZIP。额度异常时，填写新模型后点击“切换模型并继续”，等待中的题目会从失败轮次重试。</p><div class="nodes" id="nodes"></div><div class="error" id="error"></div></section><section class="list" id="list"></section></main><script>
const $=s=>document.querySelector(s);const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function json(url,opt){const r=await fetch(url,opt);return r.json()}function renderNodes(data){$('#nodes').innerHTML=Object.entries(data).map(([p,v])=>`<span class="node ${v.ok?'ok':'bad'}">${p} · ${v.ok?'就绪':'未就绪'}${v.model?' · '+esc(v.model):''}</span>`).join('')}
function render(s){$('#summary').textContent=s.running?`正在生成 ${s.range}`:(s.zip?`已完成 ${s.range}`:'等待启动');$('#error').textContent=s.error||'';const items=Object.values(s.items||{}).sort((a,b)=>a.number-b.number);$('#list').innerHTML=items.map(x=>`<article class="item"><div class="top"><span class="num">${x.number}</span><span class="question">${esc(x.question)}</span><span class="state">端口 ${x.port} · ${esc(x.round)} · ${esc(x.status)} ${esc(x.stage)}</span></div>${x.feedback_v2?`<div class="detail"><b>V1 → V2 专家反馈（${esc(x.feedback_source)}）</b><div class="feedback">${esc(x.feedback_v2)}</div>${x.feedback_v3?`<b>V2 → V3 专家反馈</b><div class="feedback">${esc(x.feedback_v3)}</div>`:''}</div>`:''}</article>`).join('')+(s.zip?`<article class="item">压缩包已生成：<a href="/${esc(s.zip)}" download>${esc(s.zip)}</a></article>`:'')}
function updateOutput(){const start=$('#start').value||'起始',end=$('#end').value||'结束';$('#outputDir').value=`output/${start}-${end}`}async function poll(){try{renderNodes(await json('/api/healths'));render(await json('/api/status'))}catch(e){$('#error').textContent=e.message}}$('#start').oninput=updateOutput;$('#end').oninput=updateOutput;$('#startButton').onclick=async()=>{const ports=$('#ports').value.split(',').map(x=>+x.trim()).filter(Boolean),model=$('#model').value.trim(),output_dir=$('#outputDir').value.trim();const r=await json('/api/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({start:+$('#start').value,end:+$('#end').value,ports,model,output_dir})});if(!r.ok)$('#error').textContent=r.error;else $('#startButton').disabled=true};$('#switchButton').onclick=async()=>{const r=await json('/api/switch-model',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:$('#model').value.trim()})});if(!r.ok)$('#error').textContent=r.error};$('#resetButton').onclick=async()=>{const r=await json('/api/reset',{method:'POST'});if(!r.ok){$('#error').textContent=r.error;return}location.reload()};poll();setInterval(poll,2500);
</script></body></html>
